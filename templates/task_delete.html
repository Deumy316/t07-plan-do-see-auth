{% extends 'base.html' %}
{% block title %}할 일 삭제 확인{% endblock %}
{% block body %}<div class="heading"><div><h1>할 일을 삭제할까요?</h1><p class="muted">삭제하면 목록과 집계에서 제외됩니다. 화면에서 되돌릴 수 없습니다.</p></div></div><section class="card"><h2>{{ task.title }}</h2><p class="prose">{{ task.content }}</p><form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="version" value="{{ task.version }}"><input type="hidden" name="confirm" value="yes"><div class="form-actions"><a class="button secondary" href="{{ url_for('task_list', plan_id=task.plan_id) }}">취소</a><button type="submit">삭제 확인</button></div></form></section>{% endblock %}
